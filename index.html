<script>
'use strict';

/* =====================================================================
   DIAGRAMME (Chart.js)
   ===================================================================== */
class Diagramme {
  constructor() { this.charts = {}; }
  farben() {
    const c = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    return {accent:c('--accent'), muted:c('--muted'), good:c('--good'), warn:c('--warn'), line:c('--line'), text:c('--text')};
  }
  zeichne(id, config) {
    if (this.charts[id]) this.charts[id].destroy();
    const el = document.getElementById(id);
    if (!el || typeof Chart === 'undefined') return;           // z. B. offline: Diagramm entfällt
    this.charts[id] = new Chart(el, config);
  }
  // Senkrechte Linie bei Ende der Zinsbindung
  marker() {
    return {id:'bindung', afterDatasetsDraw(chart, args, opt) {
      if (opt.index == null || opt.index <= 0) return;
      const {ctx, chartArea:{top, bottom}, scales:{x}} = chart;
      const px = x.getPixelForValue(opt.index);
      ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = opt.farbe; ctx.beginPath();
      ctx.moveTo(px, top); ctx.lineTo(px, bottom); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = opt.farbe; ctx.font = '11px sans-serif';
      ctx.fillText('Zinsbindung endet', Math.min(px + 4, chart.width - 110), top + 12); ctx.restore();
    }};
  }
  basis(c) {
    if (typeof Chart !== 'undefined') Chart.defaults.color = c.muted;   // offline: Diagramme entfallen, Rest läuft
    return {responsive:true, maintainAspectRatio:false, animation:false,
            interaction:{mode:'index', intersect:false}};
  }
  // Restschuld, Immobilienwert, Nettovermögen über die Jahre
  restschuld(id, fin, o) {
    const c = this.farben(), p = fin.plan, n = p.jahre.length;
    const labels = Array.from({length:n + 1}, (_, i) => i);
    const rest = [fin.darlehen, ...p.jahre.map(j => j.rest)];
    const g = 1 + (o.wertsteigerung || 0) / 100;
    const wert = labels.map(i => fin.kaufpreis * Math.pow(g, i));
    const netto = labels.map((_, i) => wert[i] - rest[i]);
    this.zeichne(id, {type:'line', plugins:[this.marker()],
      data:{labels, datasets:[
        {label:'Restschuld', data:rest, borderColor:c.accent, backgroundColor:'rgba(15,118,110,.15)', fill:true, tension:.2, pointRadius:0},
        {label:'Immobilienwert', data:wert, borderColor:c.muted, borderDash:[6, 4], pointRadius:0},
        {label:'Nettovermögen', data:netto, borderColor:c.good, pointRadius:0}]},
      options:Object.assign(this.basis(c), {
        plugins:{bindung:{index:p.p.bindung, farbe:c.warn},
                 tooltip:{callbacks:{title:i => 'Jahr ' + i[0].label, label:i => i.dataset.label + ': ' + Fmt.eur(i.parsed.y)}}},
        scales:{x:{title:{display:true, text:'Jahre'}, grid:{color:c.line}},
                y:{ticks:{callback:v => Fmt.kurz(v)}, grid:{color:c.line}}}})});
  }
  // Zins- und Tilgungsanteil je Jahr
  zinsTilgung(id, fin) {
    const c = this.farben(), j = fin.plan.jahre;
    this.zeichne(id, {type:'bar',
      data:{labels:j.map(x => x.jahr), datasets:[
        {label:'Zinsen', data:j.map(x => x.zinsen), backgroundColor:c.warn},
        {label:'Tilgung', data:j.map(x => x.tilgung + x.sonder), backgroundColor:c.accent}]},
      options:Object.assign(this.basis(c), {
        plugins:{tooltip:{callbacks:{title:i => 'Jahr ' + i[0].label, label:i => i.dataset.label + ': ' + Fmt.eur(i.parsed.y)}}},
        scales:{x:{stacked:true, title:{display:true, text:'Jahr'}, grid:{display:false}},
                y:{stacked:true, ticks:{callback:v => Fmt.kurz(v)}, grid:{color:c.line}}}})});
  }
}

/* =====================================================================
   GITHUB-ANBINDUNG: Einstellungen ins Repository schreiben, Suche starten
   Das Zugriffstoken liegt nur im Browser dieses Geräts (localStorage), nie im Backup-Export.
   ===================================================================== */
const GH_KEY = 'immoAnalyse.github';
class Github {
  constructor(cfg) { this.cfg = cfg || {repo:'', token:''}; }

  static laden() {
    let c = null;
    try { c = JSON.parse(localStorage.getItem(GH_KEY)); } catch (e) { /* ohne Speicher: leer starten */ }
    return new Github(c && c.repo ? c : {repo:Github.erkenneRepo(), token:''});
  }
  // GitHub-Pages-Adresse https://NAME.github.io/REPO/ -> "NAME/REPO"
  static erkenneRepo() {
    if (!location.hostname.endsWith('.github.io')) return '';
    const repo = location.pathname.split('/')[1];
    return repo ? location.hostname.split('.')[0] + '/' + repo : '';
  }
  speichern(repo, token) {
    this.cfg = {repo:repo.trim(), token:token.trim()};
    try { localStorage.setItem(GH_KEY, JSON.stringify(this.cfg)); } catch (e) { /* z. B. privater Modus */ }
  }
  bereit() { return !!(this.cfg.repo && this.cfg.token); }

  // Aufruf der GitHub-API für dieses Repository
  async api(pfad, opt = {}) {
    const r = await fetch('https://api.github.com/repos/' + this.cfg.repo + pfad, Object.assign({}, opt, {
      headers:Object.assign({Authorization:'Bearer ' + this.cfg.token, Accept:'application/vnd.github+json',
                             'X-GitHub-Api-Version':'2022-11-28'}, opt.headers || {})}));
    if (!r.ok) {
      const text = r.status === 401 ? 'Token ungültig oder abgelaufen'
        : r.status === 403 || r.status === 404 ? 'keine Berechtigung, oder Repository/Datei nicht gefunden (' + r.status + ')'
        : r.status === 409 || r.status === 422 ? 'Datei wurde zwischenzeitlich geändert, bitte „Neu laden“ (' + r.status + ')'
        : 'GitHub-Fehler ' + r.status;
      throw new Error(text);
    }
    return r;
  }
  // JSON-Datei lesen, liefert Inhalt und sha (für späteres Überschreiben)
  async lies(pfad) {
    const d = await (await this.api('/contents/' + pfad + '?t=' + Date.now(), {cache:'no-store'})).json();
    const text = new TextDecoder().decode(Uint8Array.from(atob(d.content.replace(/\n/g, '')), c => c.charCodeAt(0)));
    return {sha:d.sha, daten:JSON.parse(text)};
  }
  // Größere JSON-Datei roh lesen (z. B. data/funde.json), immer der aktuelle Stand
  async liesRoh(pfad) {
    const r = await this.api('/contents/' + pfad + '?t=' + Date.now(), {cache:'no-store', headers:{Accept:'application/vnd.github.raw+json'}});
    return r.json();
  }
  // JSON-Datei schreiben (Commit), liefert die neue sha
  async schreibe(pfad, daten, sha, nachricht) {
    const bytes = new TextEncoder().encode(JSON.stringify(daten, null, 2) + '\n');
    let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
    const r = await this.api('/contents/' + pfad, {method:'PUT', body:JSON.stringify({message:nachricht, content:btoa(bin), sha})});
    return (await r.json()).content.sha;
  }
  // Startet den Suchlauf sofort (Workflow "suche.yml")
  async starteLauf() {
    const info = await (await this.api('')).json();
    await this.api('/actions/workflows/suche.yml/dispatches', {method:'POST', body:JSON.stringify({ref:info.default_branch})});
  }
  async letzterLauf() {
    const d = await (await this.api('/actions/workflows/suche.yml/runs?per_page=1&t=' + Date.now(), {cache:'no-store'})).json();
    return (d.workflow_runs || [])[0] || null;
  }
}

/* =====================================================================
   APP / OBERFLÄCHE
   ===================================================================== */
class App {
  constructor() {
    const g = Speicher.laden();
    this.s = (g && Array.isArray(g.objekte))
      ? {objekte:g.objekte.map(Immobilie.normalisiere), aktivId:g.aktivId, sort:g.sort || 'score'}
      : {objekte:[Immobilie.beispiel()], aktivId:null, sort:'score'};
    if (!this.aktiv()) this.s.aktivId = this.s.objekte[0] ? this.s.objekte[0].id : null;
    // Zuletzt verwendete Import-Einstellungen (Bundesland, Annahmen für Miete und Marktpreis)
    this.s.imp = Object.assign({bundesland:'NW', mieteQm:'', marktQm:''}, (g && g.imp) || {});
    this.s.fs = Object.assign({}, (g && g.fs) || {});     // Funde: Inserat-ID -> 'ok' (übernommen) | 'hide' (ausgeblendet)
    this.funde = null;                                     // zuletzt geladene data/funde.json
    this.es = Einstellungen.standard(); this.esSha = null; this.esDirty = false;   // Einstellungen der Suche
    this.lauf = {text:'', laeuft:false}; this.pollMs = 8000;                        // Status von "Jetzt prüfen"
    this.gh = Github.laden();                                                       // GitHub-Verbindung (Token nur in diesem Browser)
    this.tab = 'objekte';
    this.diagramme = new Diagramme();
    this.bind();
    this.setTab('objekte');
    this.ladeEinstellungen();
  }
  aktiv() { return this.s.objekte.find(o => o.id === this.s.aktivId) || null; }
  speichern() { Speicher.speichern(this.s); }

  /* ---------- Ereignisse ---------- */
  bind() {
    document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => this.setTab(b.dataset.tab)));
    $('#objWahl').addEventListener('change', e => { this.s.aktivId = e.target.value; this.speichern(); this.renderTab(); });
    const main = $('main');
    main.addEventListener('input', e => this.onInput(e));
    main.addEventListener('change', e => this.onInput(e));
    main.addEventListener('click', e => this.onClick(e));
  }
  setTab(t) {
    this.tab = t;
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + t));
    this.renderHeader(); this.renderTab(); window.scrollTo(0, 0);
    if (t === 'objekte') this.ladeFunde();
  }
  renderTab() {
    ({objekte:() => this.renderObjekte(), eingabe:() => this.renderEingabe(), analyse:() => this.renderAnalyse(),
      finanz:() => this.renderFinanz(), suche:() => this.renderSuche(), backup:() => this.renderBackup()})[this.tab]();
  }
  renderHeader() {
    const sel = $('#objWahl');
    sel.innerHTML = this.s.objekte.length
      ? this.s.objekte.map(o => `<option value="${o.id}"${o.id === this.s.aktivId ? ' selected' : ''}>${esc(o.name)}</option>`).join('')
      : '<option>Kein Objekt</option>';
  }

  onClick(e) {
    const b = e.target.closest('[data-action]');
    if (b) return this.aktion(b.dataset.action, b.dataset.id);
    const karte = e.target.closest('.obj[data-id]');
    if (karte) { this.s.aktivId = karte.dataset.id; this.speichern(); this.setTab('analyse'); }
  }
  aktion(a, id) {
    const o = this.s.objekte.find(x => x.id === id) || this.aktiv();
    if (a === 'neu') {
      const n = Immobilie.neu(); this.s.objekte.push(n); this.s.aktivId = n.id; this.speichern(); this.setTab('eingabe');
    } else if (a === 'edit') { this.s.aktivId = id; this.speichern(); this.setTab('eingabe');
    } else if (a === 'dup' && o) {
      const n = Immobilie.normalisiere(JSON.parse(JSON.stringify(o))); n.id = neueId(); n.name += ' (Kopie)';
      this.s.objekte.push(n); this.s.aktivId = n.id; this.speichern(); this.setTab('objekte');
    } else if (a === 'del' && o) {
      if (!confirm('„' + o.name + '“ wirklich löschen?')) return;
      this.s.objekte = this.s.objekte.filter(x => x.id !== o.id);
      this.s.aktivId = this.s.objekte[0] ? this.s.objekte[0].id : null; this.speichern(); this.setTab('objekte');
    } else if (a === 'ek-vorschlag' && o) {
      const nk = Rechner.nebenkosten(o, o.finanz.kaufpreis).summe;
      o.finanz.eigenkapital = Math.round(nk + 0.2 * o.finanz.kaufpreis); this.speichern(); this.renderFinanz();
    } else if (a === 'jetzt-pruefen') { this.jetztPruefen();
    } else if (a === 'gh-speichern') { this.verbindungSpeichern();
    } else if (a === 'es-speichern') { this.einstellungenSpeichern();
    } else if (a === 'es-laden') { this.ladeEinstellungen(true);
    } else if (a === 'profil-neu') { this.es.profile.push(Einstellungen.standardProfil()); this.esAenderung(); this.renderSuche();
    } else if (a === 'profil-del') { this.es.profile.splice(parseInt(id, 10), 1); this.esAenderung(); this.renderSuche();
    } else if (a === 'fund-ok') { this.fundUebernehmen(id);
    } else if (a === 'fund-hide') { this.s.fs[id] = 'hide'; this.speichern(); this.renderObjekte();
    } else if (a === 'import-inserat') { this.inseratImportieren();
    } else if (a === 'export') { this.exportieren();
    } else if (a === 'import') { $('#importDatei').click();
    } else if (a === 'alles-loeschen') {
      if (!confirm('Wirklich ALLE Objekte auf diesem Gerät löschen?')) return;
      this.s.objekte = []; this.s.aktivId = null; this.speichern(); this.setTab('objekte');
    }
  }
  onInput(e) {
    const el = e.target;
    if (el.id === 'importDatei') return this.importieren(el.files[0]);
    if (el.id === 'sort') { this.s.sort = el.value; this.speichern(); return this.renderObjekte(); }
    if (/^(a|k|p\d+)$/.test(el.dataset.s || '')) return this.einstellungGeaendert(el);   // Tab "Suche"
    const o = this.aktiv(); if (!o) return;
    if (el.dataset.check != null && el.dataset.check !== '') {       // Checkliste
      o.check[el.dataset.check] = el.checked; this.speichern();
      const n = CHECKLISTE.filter((_, i) => o.check[i]).length;
      const z = $('#checkZaehler'); if (z) z.textContent = n + ' / ' + CHECKLISTE.length + ' erledigt';
      return;
    }
    const k = el.dataset.k; if (!k) return;
    const ziel = el.dataset.s === 'f' ? o.finanz : o;
    const v = this.lesWert(el);
    ziel[k] = v;
    if (k === 'bundesland' && el.dataset.s === 'o') {                 // Grunderwerbsteuer automatisch setzen
      o.grest = BUNDESLAENDER[v][1];
      const feld = $('#view-eingabe [data-k="grest"]'); if (feld) feld.value = o.grest;
    }
    this.speichern();
    if (this.tab === 'eingabe') { this.aktualisiereKurz(); if (k === 'name') this.renderHeader(); }
    else if (this.tab === 'finanz') {
      if (k === 'kaufpreisLink' || k === 'modus') this.renderFinanz(); else this.renderFinanzErgebnis();
    }
  }

  /* ---------- Bausteine ---------- */
  feld(f, wert, scope, ctx) {
    const attr = `data-k="${f.k}" data-s="${scope}"${f.opt ? ' data-opt="1"' : ''}${f.num ? ' data-num="1"' : ''}`;
    const lab = f.l + (f.u ? ` <span class="u">(${f.u})</span>` : '');
    const hint = f.h ? `<small>${f.h}</small>` : '';
    const ro = (f.ro && f.ro(ctx)) ? ' readonly' : '';
    let inp;
    if (f.t === 'checkbox') return `<label class="chk ${f.voll ? 'voll' : ''}"><input type="checkbox" ${attr}${wert ? ' checked' : ''}> ${f.l}</label>`;
    if (f.t === 'select') inp = `<select ${attr}>${f.o.map(([v, t]) => `<option value="${v}"${String(v) === String(wert) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
    else if (f.t === 'textarea') inp = `<textarea rows="3" ${attr}>${esc(wert)}</textarea>`;
    else if (f.t === 'number') inp = `<input type="number" step="${f.step || 'any'}" inputmode="decimal" ${attr} value="${wert ?? ''}"${ro}>`;
    else if (f.t === 'month') inp = `<input type="month" ${attr} value="${esc(wert)}">`;
    else inp = `<input type="text" ${attr} value="${esc(wert)}">`;
    return `<div class="fld ${f.voll ? 'voll' : ''}"><label>${lab}${inp}</label>${hint}</div>`;
  }
  formular(defs, daten, scope) {
    return defs.map(g => {
      const felder = g.felder.filter(f => !f.zeige || f.zeige(daten));
      return `<details class="card" open><summary>${g.gruppe}</summary><div class="fields">${felder.map(f => this.feld(f, daten[f.k], scope, daten)).join('')}</div></details>`;
    }).join('');
  }
  kpi(l, v, cls = '', s = '') { return `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`; }
  kopf(o) { return `<div class="sub" style="margin:0 2px 8px">${esc(o.name)}${o.ort ? ' · ' + esc(o.ort) : ''}${o.erkanntAm ? ' · erkannt ' + Fmt.vor(o.erkanntAm) : ''}</div>`; }
  leer(text) {
    return `<div class="card"><p>${text}</p><button class="btn primary" data-action="neu">+ Neues Objekt</button></div>`;
  }

  /* ---------- Tab: Objekte ---------- */
  renderObjekte() {
    const box = $('#view-objekte');
    if (!this.s.objekte.length) { box.innerHTML = this.fundeKarte() + this.importKarte() + this.leer('Noch kein Objekt vorhanden.'); return; }
    const liste = this.s.objekte.map(o => ({o, a:Bewertung.analyse(o)}));
    const sortierer = {
      score: (x, y) => (y.a.score ? y.a.score.wert : -1) - (x.a.score ? x.a.score.wert : -1),
      rendite: (x, y) => (y.a.k.bruttoRendite ?? -1) - (x.a.k.bruttoRendite ?? -1),
      preis: (x, y) => (x.o.kaufpreis || 1e15) - (y.o.kaufpreis || 1e15)
    };
    liste.sort(sortierer[this.s.sort] || sortierer.score);
    box.innerHTML = this.fundeKarte() + this.importKarte() + `
      <div class="card row">
        <button class="btn primary" data-action="neu">+ Neues Objekt</button>
        <select id="sort" style="width:auto;margin:0">
          ${[['score','Sortierung: Bewertung'],['rendite','Sortierung: Bruttorendite'],['preis','Sortierung: Kaufpreis']]
            .map(([v, t]) => `<option value="${v}"${this.s.sort === v ? ' selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>` + liste.map(({o, a}) => `
      <div class="card obj" data-id="${o.id}">
        ${a.score ? `<span class="badge ${a.score.cls}">${a.score.wert}</span>` : ''}
        <div class="t">${esc(o.name)}</div>
        <div class="sub">${esc(o.ort || '–')} · ${esc(o.art)} · ${Fmt.num(o.wohnflaeche, 0)} m² · Energie ${esc(o.energieklasse)}</div>
        ${/^https?:\/\//.test(o.link || '') ? `<div class="sub"><a href="${esc(o.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Zum Inserat</a></div>` : ''}
        <div class="chips">
          <span class="chip">Kaufpreis ${Fmt.eur(o.kaufpreis)}</span>
          <span class="chip">Brutto ${Fmt.pct(a.k.bruttoRendite)}</span>
          <span class="chip">Netto ${Fmt.pct(a.k.nettoRendite)}</span>
          <span class="chip">Faktor ${Fmt.num(a.k.faktor)}</span>
          ${o.erkanntAm ? `<span class="chip">erkannt ${Fmt.vor(o.erkanntAm)}</span>` : ''}
          ${a.cf && a.fin.darlehen > 0 ? `<span class="chip">Cashflow ${Fmt.eur(a.cf.proMonat)}/Mon.</span>` : ''}
        </div>
        <div class="row">
          <button class="btn" data-action="edit" data-id="${o.id}">Bearbeiten</button>
          <button class="btn" data-action="dup" data-id="${o.id}">Duplizieren</button>
          <button class="btn danger" data-action="del" data-id="${o.id}">Löschen</button>
        </div>
      </div>`).join('');
  }

  /* ---------- Tab: Suche (automatische Prüfung steuern) ---------- */
  // Liest den Wert eines Eingabefelds typgerecht (Zahl, Häkchen, Auswahl, Text)
  lesWert(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.type === 'number') { const v = el.value === '' ? (el.dataset.opt ? null : 0) : parseFloat(el.value); return Number.isNaN(v) ? 0 : v; }
    if (el.tagName === 'SELECT' && el.dataset.num) return parseFloat(el.value);
    return el.value;
  }
  // Feld der Einstellungen geändert: a = Automatik, k = Kriterien, pN = Suchprofil Nr. N
  einstellungGeaendert(el) {
    const s = el.dataset.s;
    const ziel = s === 'a' ? this.es.auto : s === 'k' ? this.es.kriterien : this.es.profile[parseInt(s.slice(1), 10)];
    if (!ziel) return;
    ziel[el.dataset.k] = this.lesWert(el);
    this.esAenderung();
  }
  esAenderung() { this.esDirty = true; const l = $('#esLeiste'); if (l) l.classList.add('on'); }

  // Lädt die Einstellungen: mit Verbindung direkt aus dem Repository, sonst von der veröffentlichten Seite
  async ladeEinstellungen(melden = false) {
    try {
      if (this.gh.bereit()) { const r = await this.gh.lies('config/einstellungen.json'); this.esSha = r.sha; this.es = Einstellungen.normalisiere(r.daten); }
      else { const r = await fetch('config/einstellungen.json?t=' + Date.now(), {cache:'no-store'}); if (r.ok) this.es = Einstellungen.normalisiere(await r.json()); }
      this.esDirty = false;
      if (melden) alert('Einstellungen neu geladen.');
    } catch (e) { if (melden) alert('Laden fehlgeschlagen: ' + e.message); }
    if (this.tab === 'suche') this.renderSuche();
    const box = $('#fundeBox');
    if (this.tab === 'objekte' && box) box.innerHTML = this.fundeInhalt();      // Kriterien können sich geändert haben
  }
  async einstellungenSpeichern() {
    if (!this.gh.bereit()) { alert('Bitte zuerst unten die Verbindung zu GitHub einrichten.'); return; }
    const fehler = this.es.profile.filter(p => p.aktiv).map(p => Einstellungen.pruefeProfil(p)).find(Boolean);
    if (fehler) { alert(fehler); return; }
    try {
      if (!this.esSha) this.esSha = (await this.gh.lies('config/einstellungen.json')).sha;
      this.esSha = await this.gh.schreibe('config/einstellungen.json', this.es, this.esSha, 'Einstellungen der Suche geändert');
      this.esDirty = false; $('#esLeiste').classList.remove('on');
      alert('Gespeichert. Die Änderungen gelten ab dem nächsten Lauf.');
    } catch (e) { alert('Speichern fehlgeschlagen: ' + e.message); }
  }
  async verbindungSpeichern() {
    this.gh.speichern($('#ghRepo').value, $('#ghToken').value || this.gh.cfg.token);
    this.esSha = null;
    await this.ladeEinstellungen(true);
    this.ladeFunde();
  }

  // "Jetzt prüfen": startet den Lauf auf GitHub und wartet auf das Ergebnis (höchstens ca. 5 Minuten)
  async jetztPruefen() {
    if (this.lauf.laeuft) return;
    if (!this.gh.bereit()) { alert('Bitte zuerst im Tab „Suche“ die Verbindung zu GitHub einrichten.'); return; }
    this.setzeLauf('Prüfung wird gestartet …', true);
    const start = Date.now();
    let fertig = false;
    try {
      await this.gh.starteLauf();
      for (let i = 0; i < 40 && !fertig; i++) {
        await new Promise(r => setTimeout(r, this.pollMs));
        const run = await this.gh.letzterLauf();
        if (!run || Date.parse(run.created_at) < start - 120000) { this.setzeLauf('Warte auf den Start …', true); continue; }
        if (run.status !== 'completed') { this.setzeLauf('Prüfung läuft …', true); continue; }
        if (run.conclusion !== 'success') throw new Error('Lauf fehlgeschlagen (Details unter „Actions“ auf GitHub)');
        fertig = true;
      }
      await this.ladeFunde();
      this.setzeLauf(fertig ? 'Fertig um ' + new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})
                            : 'Dauert länger als erwartet, bitte später die Seite neu laden.', false);
    } catch (e) { this.setzeLauf('Fehler: ' + e.message, false); }
  }
  setzeLauf(text, laeuft) {
    this.lauf = {text, laeuft};
    document.querySelectorAll('.laufStatus').forEach(el => { el.textContent = text; });
  }

  renderSuche() {
    const box = $('#view-suche'), e = this.es, d = this.funde, verbunden = this.gh.bereit();
    const stand = d && d.aktualisiert ? 'Letzter Lauf: ' + new Date(d.aktualisiert).toLocaleString('de-DE', {dateStyle:'short', timeStyle:'short'})
                                        + ' (Status: ' + (d.status || 'ok') + ')' : 'Noch kein Lauf';
    const naechste = (e.auto.aktiv && d && d.aktualisiert)
      ? ' · nächste Prüfung ca. ' + new Date(Date.parse(d.aktualisiert) + e.auto.intervallMinuten * 60000).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) : '';
    box.innerHTML = `
      <div class="leiste${this.esDirty ? ' on' : ''}" id="esLeiste"><span>Ungespeicherte Änderungen</span>
        <button class="btn primary" data-action="es-speichern">Speichern</button></div>
      ${verbunden ? '' : '<div class="note warn">Zum Steuern der Suche zuerst unten die Verbindung zu GitHub einrichten (einmalig).</div>'}
      <div class="card"><h2>Automatische Prüfung</h2>
        <div class="fields">
          ${this.feld({k:'aktiv', l:'Automatisch prüfen', t:'checkbox', voll:true}, e.auto.aktiv, 'a')}
          ${this.feld({k:'intervallMinuten', l:'Prüf-Intervall', t:'select', num:true, o:INTERVALLE}, e.auto.intervallMinuten, 'a')}
        </div>
        <p class="sub">${esc(stand)}${naechste}<br>GitHub kann geplante Läufe um einige Minuten verzögern.</p>
        <div class="row"><button class="btn primary" data-action="jetzt-pruefen">Jetzt prüfen</button></div>
        <div class="sub laufStatus">${esc(this.lauf.text)}</div></div>
      <details class="card" open><summary>Kriterien für die Übersicht</summary>
        <div class="fields">${FELDER_KRITERIEN.map(f => this.feld(f, e.kriterien[f.k], 'k')).join('')}</div>
        <small class="fine">Nur Inserate, die alle gesetzten Kriterien erfüllen, erscheinen unter „Neue Funde“. Leere Felder werden ignoriert. Die Kriterien gelten auch für bereits gefundene Inserate.</small></details>
      <details class="card" open><summary>Suchprofile (Städte / Regionen)</summary>
        ${e.profile.map((p, i) => `<div class="card" style="margin:8px 0"><div class="fields">${FELDER_PROFIL.map(f => this.feld(f, p[f.k], 'p' + i)).join('')}</div>
          <div class="row" style="margin-top:8px"><button class="btn danger" data-action="profil-del" data-id="${i}">Profil löschen</button></div></div>`).join('')}
        <button class="btn" data-action="profil-neu">+ Suchprofil</button></details>
      <details class="card"${verbunden ? '' : ' open'}><summary>Verbindung zu GitHub</summary>
        <div class="fields">
          <div class="fld voll"><label>Repository (Name/Repo)<input type="text" id="ghRepo" value="${esc(this.gh.cfg.repo)}" placeholder="meinname/immobilien"></label></div>
          <div class="fld voll"><label>Zugriffstoken<input type="password" id="ghToken" autocomplete="off"
            placeholder="${this.gh.cfg.token ? 'gespeichert (leer lassen = behalten)' : 'github_pat_…'}"></label></div>
        </div>
        <p class="sub">Token erstellen: GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens. Repository access: nur dieses Repository. Berechtigungen: <b>Contents</b> und <b>Actions</b> jeweils „Read and write“. Das Token bleibt nur in diesem Browser gespeichert.</p>
        <button class="btn primary" data-action="gh-speichern">Verbindung speichern</button></details>
      <div class="row"><button class="btn" data-action="es-laden">Einstellungen neu laden</button></div>`;
  }

  /* ---------- Automatische Funde (data/funde.json, geschrieben vom GitHub-Suchjob) ---------- */
  async ladeFunde() {
    let d = null;
    try { if (this.gh.bereit()) d = await this.gh.liesRoh('data/funde.json'); } catch (e) { d = null; }   // mit Verbindung: aktueller Stand
    if (!d) {
      try { const r = await fetch('data/funde.json?t=' + Date.now(), {cache:'no-store'}); d = r.ok ? await r.json() : null; }
      catch (e) { d = null; }                            // offline oder Suche nicht eingerichtet
    }
    this.funde = d;
    const box = $('#fundeBox');
    if (this.tab === 'objekte' && box) box.innerHTML = this.fundeInhalt();
    if (this.tab === 'suche') this.renderSuche();
  }
  fundeKarte() { return `<div id="fundeBox">${this.fundeInhalt()}</div>`; }
  fundeInhalt() {
    const d = this.funde, kr = this.es.kriterien;
    const knopf = `<div class="row"><button class="btn primary" data-action="jetzt-pruefen">Jetzt prüfen</button></div>
      <div class="sub laufStatus">${esc(this.lauf.text)}</div>`;
    if (!d || !Array.isArray(d.funde))
      return `<div class="card"><h2>Neue Funde</h2><p class="sub">Noch keine Daten. Die automatische Suche unter „Suche“ einrichten.</p>${knopf}</div>`;
    const stand = d.aktualisiert ? new Date(d.aktualisiert).toLocaleString('de-DE', {dateStyle:'short', timeStyle:'short'}) : 'noch kein Lauf';
    const warn = (d.status && d.status !== 'ok') ? `<div class="note warn">${esc(d.meldung || 'Der letzte Suchlauf war nicht erfolgreich.')}</div>` : '';
    // Alle gespeicherten Inserate bewerten, angezeigt werden nur die, die die aktuellen Kriterien erfüllen
    const bewertet = d.funde.filter(f => !this.s.fs[f.id]).map(f => {
      const o = Immobilie.normalisiere(JSON.parse(JSON.stringify(f.objekt)));
      return {f, o, a:Bewertung.analyse(o)};
    });
    const offen = bewertet.filter(b => Kriterien.passt(b.o, b.a, kr).passt);
    const liste = offen.map(({f, o, a}) => {
      const k = a.k;
      const link = /^https?:\/\//.test(o.link || '') ? ` · <a href="${esc(o.link)}" target="_blank" rel="noopener">Zum Inserat</a>` : '';
      return `<div class="card" style="margin:8px 0">
        ${a.score ? `<span class="badge ${a.score.cls}">${a.score.wert}</span>` : ''}
        <div style="font-weight:700">${esc(o.name)}</div>
        <div class="sub">${esc(o.ort || '–')} · ${Fmt.num(o.wohnflaeche, 0)} m² · Energie ${esc(o.energieklasse)}${link}</div>
        <div class="chips"><span class="chip">${Fmt.eur(o.kaufpreis)}</span><span class="chip">Brutto ${Fmt.pct(k.bruttoRendite)}</span>
          <span class="chip">Faktor ${Fmt.num(k.faktor)}</span>
          <span class="chip" title="${esc(new Date(f.gefunden).toLocaleString('de-DE'))}">erkannt ${Fmt.vor(f.gefunden)}</span></div>
        <div class="row"><button class="btn primary" data-action="fund-ok" data-id="${esc(f.id)}">Übernehmen</button>
          <button class="btn" data-action="fund-hide" data-id="${esc(f.id)}">Ausblenden</button></div></div>`;
    }).join('');
    const verworfen = bewertet.length - offen.length;
    return `<details class="card" open><summary>Neue Funde (${offen.length}) · Stand ${stand}</summary>${warn}
      ${liste || '<p class="sub">Keine neuen Funde, die die Kriterien erfüllen.</p>'}
      ${verworfen ? `<small class="fine">${verworfen} weitere Inserate erfüllen die Kriterien nicht.</small>` : ''}
      ${knopf}
      <small class="fine">Miete und Finanzierung sind Annahmen aus dem Suchprofil. Bitte im Inserat prüfen.</small></details>`;
  }
  // Fund als eigenes Objekt in die Liste übernehmen
  fundUebernehmen(id) {
    const f = this.funde && this.funde.funde.find(x => x.id === id);
    if (!f) return;
    const o = Immobilie.normalisiere(JSON.parse(JSON.stringify(f.objekt))); o.id = neueId();
    this.s.objekte.push(o); this.s.aktivId = o.id; this.s.fs[id] = 'ok'; this.speichern(); this.setTab('analyse');
  }

  /* ---------- Inserat-Import ---------- */
  importKarte() {
    const i = this.s.imp;
    const bl = OPT_BUNDESLAND.map(([c, n]) => `<option value="${c}"${c === i.bundesland ? ' selected' : ''}>${n}</option>`).join('');
    return `<details class="card" id="importKarte"><summary>Inserat importieren (aus ImmoScout kopiert)</summary>
      <p class="sub">Inserat öffnen, den Seitentext kopieren (alles markieren, kopieren) und hier einfügen. Die App erkennt Preis, Fläche, Zimmer, Baujahr, Energieklasse usw. und berechnet den Score.</p>
      <div class="fields">
        <div class="fld voll"><label>Inserat-Text<textarea id="impText" rows="6" placeholder="Hier einfügen …"></textarea></label></div>
        <div class="fld voll"><label>Link zum Inserat (optional)<input type="text" id="impUrl" placeholder="https://www.immobilienscout24.de/expose/…"></label></div>
        <div class="fld"><label>Bundesland<select id="impBL">${bl}</select></label></div>
        <div class="fld"><label>Annahme Miete <span class="u">(€/m² Monat)</span><input type="number" step="any" inputmode="decimal" id="impMiete" value="${i.mieteQm}"></label><small>nur wenn im Inserat keine Miete steht</small></div>
        <div class="fld"><label>Marktpreis der Lage <span class="u">(€/m²)</span><input type="number" step="any" inputmode="decimal" id="impMarkt" value="${i.marktQm}"></label></div>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-action="import-inserat">Importieren</button></div></details>`;
  }
  inseratImportieren() {
    const text = $('#impText').value.trim();
    if (text.length < 30) { alert('Bitte zuerst den Inserat-Text einfügen.'); return; }
    this.s.imp = {bundesland:$('#impBL').value, mieteQm:parseFloat($('#impMiete').value) || '', marktQm:parseFloat($('#impMarkt').value) || ''};
    const r = InseratParser.alsImmobilie(text, {url:$('#impUrl').value.trim(), bundesland:this.s.imp.bundesland,
                                                mieteQm:this.s.imp.mieteQm || 0, marktQm:this.s.imp.marktQm || 0});
    if (!r.erkannt.length) { alert('Es wurden keine Daten erkannt. Wurde der gesamte Inseratstext kopiert?'); return; }
    this.s.objekte.push(r.objekt); this.s.aktivId = r.objekt.id; this.speichern();
    const a = Bewertung.analyse(r.objekt);
    alert('Importiert: ' + r.erkannt.length + ' Felder erkannt' + (a.score ? ' · Score ' + a.score.wert + ' (' + a.score.urteil + ')' : '')
          + (r.fehlend.length ? '\nBitte ergänzen: ' + r.fehlend.join(', ') : ''));
    this.setTab('eingabe');
  }

  /* ---------- Tab: Eingabe ---------- */
  renderEingabe() {
    const o = this.aktiv(), box = $('#view-eingabe');
    if (!o) { box.innerHTML = this.leer('Lege zuerst ein Objekt an.'); return; }
    box.innerHTML = `<div class="card" id="kurz"></div>` + this.formular(FELDER_OBJEKT, o, 'o');
    this.aktualisiereKurz();
  }
  aktualisiereKurz() {
    const o = this.aktiv(), a = Bewertung.analyse(o), k = a.k;
    $('#kurz').innerHTML = `<div class="chips" style="margin:0">
      <span class="chip">Brutto ${Fmt.pct(k.bruttoRendite)}</span><span class="chip">Netto ${Fmt.pct(k.nettoRendite)}</span>
      <span class="chip">Faktor ${Fmt.num(k.faktor)}</span><span class="chip">Nebenkosten ${Fmt.eur(k.nk.summe)}</span>
      <span class="chip">Gesamt ${Fmt.eur(k.gesamt)}</span>${a.score ? `<span class="chip">Score ${a.score.wert}</span>` : ''}</div>`;
  }

  /* ---------- Tab: Analyse ---------- */
  renderAnalyse() {
    const o = this.aktiv(), box = $('#view-analyse');
    if (!o) { box.innerHTML = this.leer('Lege zuerst ein Objekt an.'); return; }
    const a = Bewertung.analyse(o), k = a.k, cf = a.cf, fin = a.fin, sc = a.score;
    const hatDarlehen = fin && fin.darlehen > 0;
    const score = sc ? `
      <div class="card"><div class="scorebox">
        <div><div class="score ${sc.cls}">${sc.wert}</div><div class="sub" style="text-align:center">${sc.urteil}</div></div>
        <div class="bars">${sc.teile.map(t => `<div class="bar">${t.n}<i style="width:${Math.round(t.v * 100)}%"></i></div>`).join('')}</div>
      </div><small class="fine">Gewichteter Score aus Rendite, Kaufpreisfaktor, Lage, Zustand, Energieklasse${hatDarlehen ? ' und Cashflow' : ''}. Kein Ersatz für eine Besichtigung und Prüfung der Unterlagen.</small></div>`
      : `<div class="card">Gib Kaufpreis und Miete ein, um Rendite und Bewertung zu sehen.</div>`;
    const kpis1 = this.kpi('Bruttomietrendite', Fmt.pct(k.bruttoRendite), ampel(k.bruttoRendite, 5, 3.5), 'Jahreskaltmiete / Kaufpreis')
      + this.kpi('Nettomietrendite', Fmt.pct(k.nettoRendite), ampel(k.nettoRendite, 3.5, 2.5), 'nach Kosten, inkl. Nebenkosten')
      + this.kpi('Kaufpreisfaktor', Fmt.num(k.faktor), ampel(k.faktor, 20, 27, false), 'Kaufpreis / Jahreskaltmiete')
      + this.kpi('Gesamtinvestition', Fmt.eur(k.gesamt), '', 'inkl. Nebenkosten und Sanierung');
    const kpis2 = this.kpi('Kaufpreis pro m²', Fmt.eur(k.kpQm), '', k.vsMarkt != null ? Fmt.num(k.vsMarkt, 0) + ' % zum Markt' : '')
      + this.kpi('Miete pro m²', Fmt.eur(k.mieteQm, 2), '', k.vsMiete != null ? Fmt.num(k.vsMiete, 0) + ' % zur Vergleichsmiete' : '')
      + this.kpi('Nettoertrag p. a.', Fmt.eur(k.noi), k.noi > 0 ? '' : 'bad', 'Miete − Bewirtschaftung')
      + this.kpi('Bewirtschaftung p. a.', Fmt.eur(k.bewirt), '', 'inkl. Mietausfall')
      + this.kpi('Nettokaufpreisfaktor', Fmt.num(k.nettoFaktor), '', 'Gesamtinvestition / Nettoertrag');
    const kpis3 = (cf && hatDarlehen)
      ? this.kpi('Cashflow / Monat', Fmt.eur(cf.proMonat), cf.vor >= 0 ? 'good' : 'bad', 'vor Steuern, nach Zins und Tilgung')
        + this.kpi('Cashflow nach Steuern', Fmt.eur(cf.nachMonat), cf.nach >= 0 ? 'good' : 'warn', 'pro Monat, vereinfacht')
        + this.kpi('Eigenkapitalrendite', Fmt.pct(cf.ekRendite), ampel(cf.ekRendite, 5, 2), '(Cashflow + Tilgung) / Eigenkapital')
        + this.kpi('Schuldendienstdeckung', Fmt.num(cf.dscr, 2), ampel(cf.dscr, 1.2, 1), 'Nettoertrag / Zins + Tilgung')
      : `<div class="kpi info" style="grid-column:1/-1"><div class="l">Cashflow und Eigenkapitalrendite</div><div class="s">Folgen, sobald im Tab „Finanzierung“ ein Darlehen berechnet wird.</div></div>`;
    const nk = k.nk;
    const kosten = `<div class="card"><h2>Kostenaufstellung</h2><table>
      <tr><td>Kaufpreis</td><td>${Fmt.eur(k.kp)}</td></tr>
      <tr><td>Grunderwerbsteuer (${Fmt.pct(o.grest)})</td><td>${Fmt.eur(nk.grest)}</td></tr>
      <tr><td>Notar und Grundbuch (${Fmt.pct(o.notar)})</td><td>${Fmt.eur(nk.notar)}</td></tr>
      <tr><td>Makler (${Fmt.pct(o.makler)})</td><td>${Fmt.eur(nk.makler)}</td></tr>
      <tr><td>Sonstiges</td><td>${Fmt.eur(nk.sonst)}</td></tr>
      <tr><td>Sanierung / Renovierung</td><td>${Fmt.eur(o.sanierung)}</td></tr>
      <tr class="sum"><td>Gesamtinvestition (Nebenkosten ${Fmt.pct(k.kp > 0 ? nk.summe / k.kp * 100 : 0, 1)})</td><td>${Fmt.eur(k.gesamt)}</td></tr></table></div>`;
    const preis = k.jkm > 0 ? `<div class="card"><h2>Preisverhandlung</h2><div class="scroll"><table>
      <tr><th>Ziel-Bruttorendite</th><th>Kaufpreis</th><th>Differenz</th></tr>
      ${[4, 5, 6].map(r => { const p = k.preisBeiRendite(r); return `<tr><td>${r} %</td><td>${Fmt.eur(p)}</td><td>${Fmt.eur(p - k.kp)}</td></tr>`; }).join('')}
      </table></div><small class="fine">Kaufpreis, bei dem die Bruttomietrendite das Ziel erreicht.</small></div>` : '';
    const steuer = (cf && hatDarlehen) ? `<div class="card"><h2>Steuerliche Schätzung (Jahr 1)</h2><table>
      <tr><td>Nettoertrag</td><td>${Fmt.eur(k.noi)}</td></tr>
      <tr><td>− Zinsen</td><td>${Fmt.eur(fin.zinsJ1)}</td></tr>
      <tr><td>− AfA (Gebäude ${Fmt.pct(o.gebaeudeanteil, 0)}, ${Fmt.pct(o.afa, 1)})</td><td>${Fmt.eur(cf.afa)}</td></tr>
      <tr class="sum"><td>Steuerliches Ergebnis</td><td>${Fmt.eur(cf.ergebnis)}</td></tr>
      <tr><td>Steuerwirkung (${Fmt.pct(o.finanz.steuersatz, 0)})</td><td>${Fmt.eur(cf.steuerwirkung)}</td></tr></table>
      <small class="fine">Stark vereinfacht (Erhaltungsaufwand und Rücklagen werden als Kosten angesetzt). Bitte mit Steuerberater prüfen.</small></div>` : '';
    const hinweise = `<div class="card"><h2>Hinweise</h2>${a.hinweise.map(h => `<div class="note ${h.typ}">${h.text}</div>`).join('')}</div>`;
    const erledigt = CHECKLISTE.filter((_, i) => o.check[i]).length;
    const check = `<details class="card"><summary>Kauf-Checkliste (<span id="checkZaehler">${erledigt} / ${CHECKLISTE.length} erledigt</span>)</summary>
      ${CHECKLISTE.map((t, i) => `<label class="chk"><input type="checkbox" data-check="${i}"${o.check[i] ? ' checked' : ''}> ${t}</label>`).join('')}</details>`;
    box.innerHTML = this.kopf(o) + score + `<div class="kpis">${kpis1}</div><div class="kpis">${kpis2}</div><div class="kpis">${kpis3}</div>`
      + kosten + preis + steuer + hinweise + check
      + `<small class="fine">Modellrechnung ohne Gewähr, keine Anlage-, Steuer- oder Rechtsberatung.</small>`;
  }

  /* ---------- Tab: Finanzierung ---------- */
  renderFinanz() {
    const o = this.aktiv(), box = $('#view-finanz');
    if (!o) { box.innerHTML = this.leer('Lege zuerst ein Objekt an.'); return; }
    Finanzierung.sync(o);
    box.innerHTML = this.kopf(o) + this.formular(FELDER_FINANZ, o.finanz, 'f') + '<div id="finErg"></div>';
    this.renderFinanzErgebnis();
  }
  renderFinanzErgebnis() {
    const o = this.aktiv(), box = $('#finErg');
    const a = Bewertung.analyse(o), fin = a.fin, cf = a.cf, f = o.finanz;
    if (!fin) { box.innerHTML = '<div class="card">Bitte zuerst einen Kaufpreis eingeben (Tab „Eingabe“).</div>'; return; }
    const p = fin.plan;
    const hinweise = a.hinweise.filter(h => /Beleihungsauslauf|Rate|Anfangstilgung|Zinsbindung|Darlehenszins|Cashflow|Schuldendienst/.test(h.text));
    const vorschlag = Math.round(fin.nk.summe + 0.2 * fin.kaufpreis);
    const kpis = this.kpi('Darlehen', Fmt.eur(fin.darlehen), '', `Beleihungsauslauf ${Fmt.num(fin.ltv, 0)} %`)
      + this.kpi('Eigenkapital', Fmt.eur(fin.ek), '', `${Fmt.num(fin.ekQuote, 0)} % des Gesamtbedarfs`)
      + this.kpi('Monatliche Rate', Fmt.eur(fin.rate1, 2), '', `anfängl. Tilgung ${Fmt.pct(fin.tilgungStart)}`)
      + this.kpi('Schuldenfrei nach', p.laufzeitText(), p.getilgt ? 'good' : 'bad', p.getilgt ? 'bis ' + p.datumEnde(f.start) : 'Rate erhöhen')
      + this.kpi('Zinsen gesamt', Fmt.eur(p.gesamtZinsen), '', `Gesamtzahlung ${Fmt.eur(p.gesamtZinsen + p.gesamtTilgung + p.gesamtSonder)}`)
      + this.kpi('Restschuld nach Bindung', Fmt.eur(p.restNachBindung), '', `nach ${f.bindung} Jahren`)
      + (cf ? this.kpi('Cashflow / Monat', Fmt.eur(cf.proMonat), cf.vor >= 0 ? 'good' : 'bad', 'vor Steuern')
            + this.kpi('Cashflow nach Steuern', Fmt.eur(cf.nachMonat), cf.nach >= 0 ? 'good' : 'warn', 'vereinfacht')
            + this.kpi('Eigenkapitalrendite', Fmt.pct(cf.ekRendite), ampel(cf.ekRendite, 5, 2), 'Jahr 1') : '');
    const szen = Finanzierung.szenarien(fin).map(s => `<tr class="${s.d === 0 ? 'base' : ''}">
        <td>${Fmt.pct(s.zins2)}${s.d === 0 ? ' (Annahme)' : ''}</td><td>${s.plan.laufzeitText()}</td><td>${Fmt.eur(s.plan.gesamtZinsen)}</td>
        <td>${s.d === 0 ? '–' : (s.plan.gesamtZinsen - p.gesamtZinsen >= 0 ? '+' : '') + Fmt.eur(s.plan.gesamtZinsen - p.gesamtZinsen)}</td></tr>`).join('');
    const jahre = p.jahre.map(j => `<tr><td>${j.jahr}</td><td>${Fmt.eur(j.zinsen)}</td><td>${Fmt.eur(j.tilgung)}</td><td>${Fmt.eur(j.sonder)}</td><td>${Fmt.eur(j.rest)}</td></tr>`).join('');
    box.innerHTML = `
      <div class="card"><h2>Ergebnis</h2>
        <p class="sub">Gesamtbedarf ${Fmt.eur(fin.bedarf)} (Kaufpreis ${Fmt.eur(fin.kaufpreis)} + Nebenkosten ${Fmt.eur(fin.nk.summe)} + Sanierung ${Fmt.eur(o.sanierung)})</p>
        <button class="btn" data-action="ek-vorschlag">Eigenkapital-Vorschlag: ${Fmt.eur(vorschlag)} (Nebenkosten + 20 %)</button></div>
      <div class="kpis">${kpis}</div>
      ${hinweise.map(h => `<div class="note ${h.typ}">${h.text}</div>`).join('')}
      <div class="card"><h2>Restschuld, Immobilienwert und Nettovermögen</h2><div class="chartbox"><canvas id="chRest"></canvas></div>
        <h2>Zins- und Tilgungsanteil je Jahr</h2><div class="chartbox"><canvas id="chZT"></canvas></div></div>
      <div class="card"><h2>Szenario: Anschlusszins</h2><div class="scroll"><table>
        <tr><th>Zins nach Bindung</th><th>Schuldenfrei nach</th><th>Zinsen gesamt</th><th>Differenz</th></tr>${szen}</table></div>
        <small class="fine">Gleiche Rate wie angegeben; nach Ablauf der Zinsbindung gilt der jeweilige Zinssatz.</small></div>
      <details class="card"><summary>Tilgungsplan je Jahr</summary><div class="scroll"><table>
        <tr><th>Jahr</th><th>Zinsen</th><th>Tilgung</th><th>Sondertilg.</th><th>Restschuld</th></tr>${jahre}</table></div>
        <small class="fine">Monatliche Berechnung mit Zins/12, Sondertilgung zum Jahresende. Bankangebote können leicht abweichen.</small></details>`;
    if (fin.darlehen > 0) { this.diagramme.restschuld('chRest', fin, o); this.diagramme.zinsTilgung('chZT', fin); }
  }

  /* ---------- Tab: Backup ---------- */
  renderBackup() {
    $('#view-backup').innerHTML = `
      <div class="card"><h2>Daten sichern und übertragen</h2>
        <p>Die Daten liegen nur auf diesem Gerät (Browser). Um sie zwischen Computer und iPhone zu übertragen, exportiere eine Datei und importiere sie auf dem anderen Gerät.</p>
        <div class="row"><button class="btn primary" data-action="export">Alle Objekte exportieren</button>
        <button class="btn" data-action="import">Datei importieren</button></div>
        <input type="file" id="importDatei" accept="application/json,.json" style="display:none">
        <p class="sub">Beim Import werden Objekte mit gleicher Kennung ersetzt, neue werden ergänzt.</p></div>
      <div class="card"><h2>Zurücksetzen</h2><button class="btn danger" data-action="alles-loeschen">Alle Objekte auf diesem Gerät löschen</button></div>`;
  }
  exportieren() {
    const text = JSON.stringify({version:1, objekte:this.s.objekte}, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.download = 'immobilien-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  importieren(datei) {
    if (!datei) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.objekte)) throw new Error('Format');
        d.objekte.map(Immobilie.normalisiere).forEach(n => {
          const i = this.s.objekte.findIndex(x => x.id === n.id);
          if (i >= 0) this.s.objekte[i] = n; else this.s.objekte.push(n);
        });
        if (!this.aktiv()) this.s.aktivId = this.s.objekte[0].id;
        this.speichern(); alert(d.objekte.length + ' Objekt(e) importiert.'); this.setTab('objekte');
      } catch (e) { alert('Die Datei konnte nicht gelesen werden.'); }
    };
    r.readAsText(datei);
  }
}

const $ = (s, r = document) => r.querySelector(s);
window.addEventListener('DOMContentLoaded', () => { window.app = new App(); });
</script>
</body>
</html>
